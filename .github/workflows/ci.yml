name: ci

on:
  push:
  pull_request:

# No LLM, E2B, Twilio or Retell credentials are ever provided to CI.
# All tests use mock providers.
env:
  LLM_PROVIDER: mock
  SANDBOX_PROVIDER: local
  SERVICE_PROVIDER: mock

jobs:
  sandbox-agents:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sandbox-agents
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --group dev
      - run: uv run playwright install --with-deps chromium
      - run: make test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sandbox-agents-screenshots
          path: sandbox-agents/tests/e2e/screenshots/*.png
          if-no-files-found: ignore

  outbound-ai:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: outbound-ai
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --group dev
      - run: uv run playwright install --with-deps chromium
      - run: make test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: outbound-ai-screenshots
          path: outbound-ai/tests/e2e/screenshots/*.png
          if-no-files-found: ignore
