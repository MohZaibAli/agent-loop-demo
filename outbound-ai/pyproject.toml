[project]
name = "outbound-ai"
version = "0.1.0"
description = "Voice Flow Agent: Google Sheets -> Twilio SMS -> Retell AI outbound call -> sheet update"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "gspread>=6.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "playwright>=1.47",
    "pytest-playwright>=0.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv]
package = false
