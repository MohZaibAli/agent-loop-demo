# Agent defaults and model pricing (USD per token) used when OpenRouter
# does not return an accounted cost. Prices from openrouter.ai/api/v1/models.
defaults:
  max_turns: 15
  max_cost_usd: 0.25
  run_timeout_s: 600
  sandbox_ttl_s: 900
  sandbox_idle_s: 300
budget:
  global_ceiling_usd: 4.00
models:
  anthropic/claude-haiku-4.5:
    prompt: 0.000001
    completion: 0.000005
    input_cache_read: 0.0000001
    input_cache_write: 0.00000125
